services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cutcatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cutcatch}
      POSTGRES_DB: cutcatch
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - cutcatch-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cutcatch -d cutcatch"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cutcatch-postgres:
