services:
  - type: web
    name: cut-and-catch
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm run db:migrate:deploy && npm run db:seed && npm run start
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: cut-and-catch-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: NEXTAUTH_URL
        fromService:
          name: cut-and-catch
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_SITE_URL
        fromService:
          name: cut-and-catch
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: CUT_CATCH_LOCAL_DEMO
        value: "false"

databases:
  - name: cut-and-catch-db
    plan: free
    region: singapore
    postgresMajorVersion: "17"
    databaseName: cutcatch
    user: cutcatch
